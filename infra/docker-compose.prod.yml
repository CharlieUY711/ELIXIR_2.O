services:
  catalog-frontend:
    build:
      context: ../catalog/frontend
      dockerfile: Dockerfile
    container_name: elixir-catalog-frontend
    environment:
      NODE_ENV: production
    ports:
      - "5173:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

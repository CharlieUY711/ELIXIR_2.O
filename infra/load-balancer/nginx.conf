# Configuración de Nginx como Balanceador de Carga
# Para ELIXIR 2.0 - Arquitectura Escalable

upstream elixir_core {
    # Balanceo round-robin con health checks
    least_conn;  # Usa least connections en lugar de round-robin
    
    # Health check configuration
    server elixir-core-1:3000 max_fails=3 fail_timeout=30s;
    server elixir-core-2:3000 max_fails=3 fail_timeout=30s;
    server elixir-core-3:3000 max_fails=3 fail_timeout=30s backup;
    
    keepalive 32;
}

upstream chat_orchestrator {
    least_conn;
    
    server chat-orchestrator-1:3001 max_fails=3 fail_timeout=30s;
    server chat-orchestrator-2:3001 max_fails=3 fail_timeout=30s;
    server chat-orchestrator-3:3001 max_fails=3 fail_timeout=30s backup;
    
    keepalive 32;
}

upstream whatsapp_edge {
    least_conn;
    
    server whatsapp-edge-1:3002 max_fails=3 fail_timeout=30s;
    server whatsapp-edge-2:3002 max_fails=3 fail_timeout=30s;
    server whatsapp-edge-3:3002 max_fails=3 fail_timeout=30s backup;
    
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=50r/s;

# Configuración del servidor principal
server {
    listen 80;
    server_name api.elixir.local;
    
    # Logging
    access_log /var/log/nginx/elixir_access.log;
    error_log /var/log/nginx/elixir_error.log;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # API Core endpoints
    location /api/core/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://elixir_core/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Health check
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    }
    
    # Chat Orchestrator endpoints
    location /api/chat/ {
        limit_req zone=chat_limit burst=10 nodelay;
        
        proxy_pass http://chat_orchestrator/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    }
    
    # WhatsApp Edge endpoints
    location /api/whatsapp/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://whatsapp_edge/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    }
}

# Configuración HTTPS (SSL/TLS termination)
server {
    listen 443 ssl http2;
    server_name api.elixir.local;
    
    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # SSL Session Cache
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Logging
    access_log /var/log/nginx/elixir_ssl_access.log;
    error_log /var/log/nginx/elixir_ssl_error.log;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # API Core endpoints
    location /api/core/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://elixir_core/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    }
    
    # Chat Orchestrator endpoints
    location /api/chat/ {
        limit_req zone=chat_limit burst=10 nodelay;
        
        proxy_pass http://chat_orchestrator/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    }
    
    # WhatsApp Edge endpoints
    location /api/whatsapp/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://whatsapp_edge/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    }
}


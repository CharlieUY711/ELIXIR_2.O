# Configuración de Traefik como Balanceador de Carga Dinámico
# Para ELIXIR 2.0 - Arquitectura Escalable

api:
  dashboard: true
  insecure: false  # En producción, usar autenticación

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: elixir-network
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@elixir.local
      storage: /etc/traefik/acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO

accessLog:
  filePath: /var/log/traefik/access.log

metrics:
  prometheus:
    entryPoint: websecure
    buckets:
      - 0.1
      - 0.3
      - 1.2
      - 5.0

# Rate limiting
http:
  middlewares:
    api-rate-limit:
      rateLimit:
        average: 100
        burst: 20
    chat-rate-limit:
      rateLimit:
        average: 50
        burst: 10
    security-headers:
      headers:
        frameDeny: true
        sslRedirect: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000


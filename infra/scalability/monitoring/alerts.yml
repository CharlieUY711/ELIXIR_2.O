# Reglas de alertas para Prometheus
# Define umbrales y condiciones para notificaciones automáticas

groups:
  - name: elixir_alerts
    interval: 30s
    rules:
      # Alertas de CPU
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Alto uso de CPU en {{ $labels.instance }}"
          description: "El uso de CPU está en {{ $value }}% durante más de 5 minutos"

      - alert: CriticalCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Uso crítico de CPU en {{ $labels.instance }}"
          description: "El uso de CPU está en {{ $value }}% durante más de 2 minutos"

      # Alertas de Memoria
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Alto uso de memoria en {{ $labels.instance }}"
          description: "El uso de memoria está en {{ $value }}% durante más de 5 minutos"

      - alert: CriticalMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Uso crítico de memoria en {{ $labels.instance }}"
          description: "El uso de memoria está en {{ $value }}% durante más de 2 minutos"

      # Alertas de servicios
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Servicio {{ $labels.job }} está caído"
          description: "El servicio {{ $labels.job }} en {{ $labels.instance }} no responde"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Alta tasa de errores en {{ $labels.job }}"
          description: "La tasa de errores 5xx es {{ $value }} errores/segundo"

      # Alertas de Redis
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis está caído"
          description: "Redis en {{ $labels.instance }} no responde"

      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis usando mucha memoria"
          description: "Redis está usando {{ $value }}% de su memoria máxima"

      # Alertas de latencia
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Alta latencia en {{ $labels.job }}"
          description: "El percentil 95 de latencia es {{ $value }} segundos"

      # Alertas de autoscaling
      - alert: PodsScalingUp
        expr: increase(kube_horizontalpodautoscaler_status_current_replicas[5m]) > 0
        for: 1m
        labels:
          severity: info
        annotations:
          summary: "Autoscaling activado para {{ $labels.name }}"
          description: "El HPA está escalando {{ $labels.name }} a {{ $value }} réplicas"

      - alert: MaxReplicasReached
        expr: kube_horizontalpodautoscaler_status_current_replicas == kube_horizontalpodautoscaler_spec_max_replicas
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Máximo de réplicas alcanzado para {{ $labels.name }}"
          description: "{{ $labels.name }} ha alcanzado el máximo de {{ $value }} réplicas y puede necesitar más recursos"


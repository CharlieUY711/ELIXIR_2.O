upstream elixir_core_backend {
    least_conn;
    server elixir-core-1:8080 max_fails=3 fail_timeout=30s;
    server elixir-core-2:8080 max_fails=3 fail_timeout=30s;
    server elixir-core-3:8080 max_fails=3 fail_timeout=30s backup;
    
    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 60s;
}

upstream whatsapp_edge_backend {
    ip_hash;  # Para mantener sesiones de WhatsApp
    server whatsapp-edge-1:3000 max_fails=3 fail_timeout=30s;
    server whatsapp-edge-2:3000 max_fails=3 fail_timeout=30s;
    server whatsapp-edge-3:3000 max_fails=3 fail_timeout=30s;
    
    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 60s;
}

upstream chat_orchestrator_backend {
    least_conn;
    server chat-orchestrator-1:4000 max_fails=3 fail_timeout=30s;
    server chat-orchestrator-2:4000 max_fails=3 fail_timeout=30s;
    
    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 60s;
}

# Cache zone para respuestas estáticas y API
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=elixir_cache:10m max_size=1g 
                 inactive=60m use_temp_path=off;

# Rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=whatsapp_limit:10m rate=50r/s;

server {
    listen 80;
    server_name api.elixir.local;
    
    # Logging
    access_log /var/log/nginx/elixir_access.log;
    error_log /var/log/nginx/elixir_error.log warn;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Elixir Core API
    location /api/core/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://elixir_core_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        
        # Health check endpoint sin cache
        location /api/core/health {
            proxy_pass http://elixir_core_backend/health;
            proxy_cache off;
        }
    }

    # WhatsApp Edge API
    location /api/whatsapp/ {
        limit_req zone=whatsapp_limit burst=10 nodelay;
        
        proxy_pass http://whatsapp_edge_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts más largos para WhatsApp
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Chat Orchestrator
    location /api/chat/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://chat_orchestrator_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Cache para respuestas GET
        proxy_cache elixir_cache;
        proxy_cache_valid 200 302 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Health check global
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}


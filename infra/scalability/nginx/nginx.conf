# Configuración de Nginx como Balanceador de Carga
# Distribuye el tráfico entre múltiples instancias de los servicios

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # Upstream para Elixir Core
    upstream elixir_core {
        least_conn;
        server elixir-core:3000 max_fails=3 fail_timeout=30s;
        # Agregar más instancias cuando se escalen:
        # server elixir-core-2:3000 max_fails=3 fail_timeout=30s;
        # server elixir-core-3:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Upstream para WhatsApp Edge
    upstream whatsapp_edge {
        least_conn;
        server whatsapp-edge:3001 max_fails=3 fail_timeout=30s;
        # Agregar más instancias cuando se escalen:
        # server whatsapp-edge-2:3001 max_fails=3 fail_timeout=30s;
        # server whatsapp-edge-3:3001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Upstream para Chat Orchestrator
    upstream chat_orchestrator {
        least_conn;
        server chat-orchestrator:3002 max_fails=3 fail_timeout=30s;
        # Agregar más instancias cuando se escalen:
        # server chat-orchestrator-2:3002 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Servidor HTTP - Redirige a HTTPS
    server {
        listen 80;
        server_name api.elixir.local edge.elixir.local chat.elixir.local;
        
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Servidor HTTPS para API Core
    server {
        listen 443 ssl http2;
        server_name api.elixir.local;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Health check endpoint
        location /health {
            access_log off;
            proxy_pass http://elixir_core;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://elixir_core;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
        }
    }

    # Servidor HTTPS para WhatsApp Edge
    server {
        listen 443 ssl http2;
        server_name edge.elixir.local;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location /health {
            access_log off;
            proxy_pass http://whatsapp_edge;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://whatsapp_edge;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
        }
    }

    # Servidor HTTPS para Chat Orchestrator
    server {
        listen 443 ssl http2;
        server_name chat.elixir.local;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location /health {
            access_log off;
            proxy_pass http://chat_orchestrator;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://chat_orchestrator;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}


# Horizontal Pod Autoscaler para elixir-core
# Para ELIXIR 2.0 - Arquitectura Escalable

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: elixir-core-hpa
  namespace: elixir
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: elixir-core
  minReplicas: 2
  maxReplicas: 10
  metrics:
    # Escalado basado en CPU
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Escalado basado en memoria
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # Escalado basado en requests por segundo (requiere Prometheus)
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "100"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max


# Horizontal Pod Autoscaler para chat-orchestrator
# Para ELIXIR 2.0 - Arquitectura Escalable

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chat-orchestrator-hpa
  namespace: elixir
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chat-orchestrator
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: active_connections
        target:
          type: AverageValue
          averageValue: "50"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30


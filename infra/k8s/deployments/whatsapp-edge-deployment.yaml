# Deployment de whatsapp-edge para Kubernetes
# Para ELIXIR 2.0 - Arquitectura Escalable

apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-edge
  namespace: elixir
  labels:
    app: whatsapp-edge
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whatsapp-edge
  template:
    metadata:
      labels:
        app: whatsapp-edge
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3002"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: whatsapp-edge
        image: whatsapp-edge:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3002
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3002"
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: elixir-secrets
              key: redis-url
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: whatsapp-edge
  namespace: elixir
  labels:
    app: whatsapp-edge
spec:
  type: ClusterIP
  ports:
  - port: 3002
    targetPort: 3002
    protocol: TCP
    name: http
  selector:
    app: whatsapp-edge


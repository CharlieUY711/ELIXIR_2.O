# Deployment de elixir-core para Kubernetes con Redundancia y Failover
# Para ELIXIR 2.0 - Fase 7.5: Redundancia y Recuperación

apiVersion: apps/v1
kind: Deployment
metadata:
  name: elixir-core
  namespace: elixir
  labels:
    app: elixir-core
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Garantizar disponibilidad durante actualizaciones
  selector:
    matchLabels:
      app: elixir-core
  template:
    metadata:
      labels:
        app: elixir-core
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      # Pod Disruption Budget para alta disponibilidad
      terminationGracePeriodSeconds: 30
      containers:
      - name: elixir-core
        image: elixir-core:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: elixir-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: elixir-secrets
              key: redis-url
        - name: CIRCUIT_BREAKER_ENABLED
          value: "true"
        - name: HEALTH_CHECK_INTERVAL
          value: "5000"
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        # Health Check mejorado - Liveness Probe
        livenessProbe:
          httpGet:
            path: /health/live
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        # Health Check mejorado - Readiness Probe
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
        # Startup Probe para aplicaciones que tardan en iniciar
        startupProbe:
          httpGet:
            path: /health/startup
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
          successThreshold: 1
        volumeMounts:
        - name: config
          mountPath: /app/config
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: elixir-core-config
      - name: tmp
        emptyDir: {}
      # Anti-affinity para distribuir pods en diferentes nodos
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - elixir-core
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: elixir-core
  namespace: elixir
  labels:
    app: elixir-core
  annotations:
    # Configuración de Traefik para failover
    traefik.ingress.kubernetes.io/service.serversscheme: http
    traefik.ingress.kubernetes.io/service.serversport: "3000"
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: elixir-core
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
# Pod Disruption Budget para garantizar disponibilidad mínima
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: elixir-core-pdb
  namespace: elixir
spec:
  minAvailable: 2  # Al menos 2 pods siempre disponibles
  selector:
    matchLabels:
      app: elixir-core

# Configuración de Redis Sentinel
# Para ELIXIR 2.0 - Fase 7.5: Redundancia

port 26379

sentinel monitor elixir-master redis-master-1 6379 2
sentinel auth-pass elixir-master ${REDIS_PASSWORD}
sentinel down-after-milliseconds elixir-master 5000
sentinel parallel-syncs elixir-master 1
sentinel failover-timeout elixir-master 10000
sentinel deny-scripts-reconfig yes

# Logging
loglevel notice
logfile ""

# Notificaciones (opcional)
# sentinel notification-script elixir-master /etc/redis/notify.sh


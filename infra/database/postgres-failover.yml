# Configuración de Failover Automático para PostgreSQL con Patroni
# Para ELIXIR 2.0 - Fase 7.5: Redundancia

version: '3.8'

services:
  # PostgreSQL Primary con Patroni
  postgres-primary:
    image: postgres:15-alpine
    container_name: postgres-primary
    environment:
      POSTGRES_DB: elixir
      POSTGRES_USER: elixir_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
      - ./patroni-config.yml:/etc/patroni/patroni.yml
    command: >
      patroni /etc/patroni/patroni.yml
    ports:
      - "5432:5432"
    networks:
      - elixir-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elixir_user || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # PostgreSQL Replica 1 con Patroni
  postgres-replica-1:
    image: postgres:15-alpine
    container_name: postgres-replica-1
    environment:
      POSTGRES_DB: elixir
      POSTGRES_USER: elixir_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
      PATRONI_SCOPE: elixir-cluster
      PATRONI_NAME: replica-1
    volumes:
      - postgres-replica-1-data:/var/lib/postgresql/data
      - ./patroni-config.yml:/etc/patroni/patroni.yml
    command: >
      patroni /etc/patroni/patroni.yml
    ports:
      - "5433:5432"
    networks:
      - elixir-network
    depends_on:
      - postgres-primary
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elixir_user || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # PostgreSQL Replica 2 con Patroni
  postgres-replica-2:
    image: postgres:15-alpine
    container_name: postgres-replica-2
    environment:
      POSTGRES_DB: elixir
      POSTGRES_USER: elixir_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
      PATRONI_SCOPE: elixir-cluster
      PATRONI_NAME: replica-2
    volumes:
      - postgres-replica-2-data:/var/lib/postgresql/data
      - ./patroni-config.yml:/etc/patroni/patroni.yml
    command: >
      patroni /etc/patroni/patroni.yml
    ports:
      - "5434:5432"
    networks:
      - elixir-network
    depends_on:
      - postgres-primary
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elixir_user || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Etcd para coordinación de Patroni
  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: etcd
    environment:
      ETCD_NAME: etcd1
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_INITIAL_CLUSTER: etcd1=http://etcd:2380
      ETCD_INITIAL_CLUSTER_TOKEN: elixir-cluster
    volumes:
      - etcd-data:/etcd-data
    ports:
      - "2379:2379"
      - "2380:2380"
    networks:
      - elixir-network
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # HAProxy para balanceo y failover
  haproxy:
    image: haproxy:2.8-alpine
    container_name: haproxy-postgres
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "6432:6432"  # Puerto para aplicaciones
      - "8404:8404"  # Estadísticas
    networks:
      - elixir-network
    depends_on:
      - postgres-primary
      - postgres-replica-1
      - postgres-replica-2
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-primary-data:
  postgres-replica-1-data:
  postgres-replica-2-data:
  etcd-data:

networks:
  elixir-network:
    external: true


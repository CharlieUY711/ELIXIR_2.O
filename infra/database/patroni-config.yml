# Configuración de Patroni para Alta Disponibilidad
# Para ELIXIR 2.0 - Fase 7.5: Redundancia

scope: elixir-cluster
namespace: /elixir/

restapi:
  listen: 0.0.0.0:8008
  connect_address: ${PATRONI_NAME}:8008
  authentication:
    username: admin
    password: ${PATRONI_RESTAPI_PASSWORD}

etcd:
  hosts: etcd:2379

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 30
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        wal_level: replica
        hot_standby: "on"
        wal_keep_segments: 8
        max_wal_senders: 3
        max_replication_slots: 3
        wal_log_hints: "on"
        archive_mode: "on"
        archive_command: "mkdir -p /var/lib/postgresql/archive && cp %p /var/lib/postgresql/archive/%f"
        archive_timeout: 300s

postgresql:
  listen: 0.0.0.0:5432
  connect_address: ${PATRONI_NAME}:5432
  data_dir: /var/lib/postgresql/data
  pgpass: /tmp/pgpass
  authentication:
    replication:
      username: replicator
      password: ${POSTGRES_REPLICATION_PASSWORD}
    superuser:
      username: postgres
      password: ${POSTGRES_PASSWORD}
  parameters:
    unix_socket_directories: '/var/run/postgresql'

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false


# Configuración de HAProxy para PostgreSQL con Failover
# Para ELIXIR 2.0 - Fase 7.5: Redundancia

global
    log stdout format raw local0
    maxconn 1000

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    option tcplog

# Frontend para escrituras (solo primary)
frontend postgres_write
    bind *:6432
    default_backend postgres_primary

# Backend para escrituras (primary)
backend postgres_primary
    option httpchk GET /master
    http-check expect status 200
    server postgres-primary postgres-primary:5432 check port 8008 inter 5s fall 3 rise 3
    server postgres-replica-1 postgres-replica-1:5432 check port 8008 inter 5s fall 3 rise 3 backup
    server postgres-replica-2 postgres-replica-2:5432 check port 8008 inter 5s fall 3 rise 3 backup

# Frontend para lecturas (réplicas)
frontend postgres_read
    bind *:6433
    default_backend postgres_replicas

# Backend para lecturas (réplicas)
backend postgres_replicas
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    server postgres-replica-1 postgres-replica-1:5432 check port 8008 inter 5s fall 3 rise 3
    server postgres-replica-2 postgres-replica-2:5432 check port 8008 inter 5s fall 3 rise 3
    server postgres-primary postgres-primary:5432 check port 8008 inter 5s fall 3 rise 3 backup

# Estadísticas
listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 10s
    stats admin if TRUE

